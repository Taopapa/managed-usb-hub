name: Wails Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - os: ubuntu-latest
            platform: linux/arm64
            arch: arm64
          - os: windows-latest
            platform: windows/amd64
            arch: amd64
          - os: macos-latest
            platform: darwin/universal
            arch: universal

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" == "arm64" ]; then
            # 对于 ARM64，我们只编译 CLI，不需要 GUI 库，只需要基础构建工具和交叉编译器
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu build-essential pkg-config
          else
            # AMD64 正常编译 GUI
            sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config
          fi

      - name: Build GUI App
        if: matrix.os == 'windows-latest'
        run: |
          wails build -platform ${{ matrix.platform }} -tags webkit2_41 -nsis

      - name: Build GUI App (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          # 仅当不是 Linux ARM64 时才构建 GUI
          if [ "${{ matrix.arch }}" != "arm64" ] || [ "${{ matrix.os }}" != "ubuntu-latest" ]; then
             echo "Building GUI for ${{ matrix.os }}-${{ matrix.arch }}..."
             wails build -platform ${{ matrix.platform }} -tags webkit2_41
          else
             echo "Skipping GUI build for Linux ARM64 (CLI only)"
          fi

      - name: Build CLI Tool
        shell: bash
        run: |
          mkdir -p build/bin
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            go build -o "build/bin/hub-cli.exe" ./cmd/hub-cli
          else
            if [ "${{ matrix.arch }}" == "arm64" ] && [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
               export GOARCH=arm64
               export CC=aarch64-linux-gnu-gcc
            fi
            go build -o "build/bin/hub-cli" ./cmd/hub-cli
          fi

      - name: Package macOS App
        if: matrix.os == 'macos-latest'
        run: |
          cd build/bin
          # 如果找到了 managed-usb-hub-wails.app，则重命名为 Managed USB Hub.app 以符合预期
          if [ -d "managed-usb-hub-wails.app" ]; then
             mv "managed-usb-hub-wails.app" "Managed USB Hub.app"
          fi
          
          # 确保 .app 存在
          if [ -d "Managed USB Hub.app" ]; then
             zip -r "Managed-USB-Hub-macOS.zip" "Managed USB Hub.app" "hub-cli"
          else
             echo "Error: Managed USB Hub.app not found!"
             ls -la
             exit 1
          fi

      - name: Package Windows App
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # 移动生成的安装包到 build/bin 目录以便统一打包上传
          # 根据 NSIS 脚本，输出文件名为 "ManagedUSBHub_Setup.exe"
          
          # 列出所有 exe 文件以供调试
          Write-Host "Listing build/bin contents:"
          Get-ChildItem "build/bin"
          Write-Host "Listing build/windows/installer contents:"
          Get-ChildItem "build/windows/installer"
          
          # 尝试在 build/bin 中查找
          $installer = Get-ChildItem "build/bin/ManagedUSBHub_Setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          
          if (-not $installer) {
             # 如果在 build/bin 没找到，尝试在 build/windows/installer 目录查找（有时会生成在这里）
             $installer = Get-ChildItem "build/windows/installer/ManagedUSBHub_Setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }

          if ($installer) {
            Move-Item $installer.FullName "build/bin/Managed-USB-Hub-Setup.exe"
            Write-Host "Installer moved successfully from $($installer.FullName)."
          } else {
             # 如果找不到指定名称，尝试查找任何 *Setup.exe 或 *installer.exe
             $fallback = Get-ChildItem "build/bin/*Setup.exe", "build/bin/*installer.exe", "build/windows/installer/*Setup.exe", "build/windows/installer/*installer.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
             if ($fallback) {
                 Write-Host "Found fallback installer: $($fallback.Name)"
                 Move-Item $fallback.FullName "build/bin/Managed-USB-Hub-Setup.exe"
             } else {
                 Write-Error "Installer not found! Contents of build/bin:"
                 Get-ChildItem "build/bin" | Format-Table Name
             }
          }
          
          # 同时保留便携版压缩包
          Compress-Archive -Path "build/bin/Managed USB Hub.exe", "build/bin/hub-cli.exe" -DestinationPath "build/bin/Managed-USB-Hub-Windows-Portable.zip"

      - name: Package Linux App
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd build/bin
          if [ "${{ matrix.arch }}" == "arm64" ]; then
             # ARM64 只打包 CLI
             tar -czvf "Managed-USB-Hub-Linux-${{ matrix.arch }}.tar.gz" "hub-cli"
          else
             # AMD64 打包 GUI 和 CLI
             tar -czvf "Managed-USB-Hub-Linux-${{ matrix.arch }}.tar.gz" "Managed USB Hub" "hub-cli"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Managed-USB-Hub-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/bin/*.zip
            build/bin/*.tar.gz
            build/bin/Managed-USB-Hub-Setup.exe
            
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/bin/*.zip
            build/bin/*.tar.gz
            build/bin/Managed-USB-Hub-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
