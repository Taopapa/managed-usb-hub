name: Wails Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - os: ubuntu-latest
            platform: linux/arm64
            arch: arm64
          - os: windows-latest
            platform: windows/amd64
            arch: amd64
          - os: macos-latest
            platform: darwin/universal
            arch: universal

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" == "arm64" ]; then
            # 对于 ARM64，我们只编译 CLI，不需要 GUI 库，只需要基础构建工具和交叉编译器
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu build-essential pkg-config
          else
            # AMD64 正常编译 GUI
            sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config
          fi

      - name: Build CLI Tool
        shell: bash
        run: |
          mkdir -p build/bin
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            go build -o "build/bin/hub-cli.exe" ./cmd/hub-cli
          else
            if [ "${{ matrix.arch }}" == "arm64" ] && [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
               export GOARCH=arm64
               export CC=aarch64-linux-gnu-gcc
            fi
            go build -o "build/bin/hub-cli" ./cmd/hub-cli
          fi

      - name: Build GUI App
        shell: bash
        run: |
          # 仅当不是 Linux ARM64 时才构建 GUI
          if [ "${{ matrix.arch }}" != "arm64" ] || [ "${{ matrix.os }}" != "ubuntu-latest" ]; then
             echo "Building GUI for ${{ matrix.os }}-${{ matrix.arch }}..."
             wails build -platform ${{ matrix.platform }} -tags webkit2_41
          else
             echo "Skipping GUI build for Linux ARM64 (CLI only)"
          fi

      - name: Package macOS App
        if: matrix.os == 'macos-latest'
        run: |
          cd build/bin
          # 如果找到了 managed-usb-hub-wails.app，则重命名为 Managed USB Hub.app 以符合预期
          if [ -d "managed-usb-hub-wails.app" ]; then
             mv "managed-usb-hub-wails.app" "Managed USB Hub.app"
          fi
          
          # 确保 .app 存在
          if [ -d "Managed USB Hub.app" ]; then
             zip -r "Managed-USB-Hub-macOS.zip" "Managed USB Hub.app" "hub-cli"
          else
             echo "Error: Managed USB Hub.app not found!"
             ls -la
             exit 1
          fi

      - name: Package Windows App
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # 仅保留便携版压缩包
          Compress-Archive -Path "build/bin/Managed USB Hub.exe", "build/bin/hub-cli.exe" -DestinationPath "build/bin/Managed-USB-Hub-Windows-Portable.zip"

      - name: Package Linux App
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd build/bin
          if [ "${{ matrix.arch }}" == "arm64" ]; then
             # ARM64 只打包 CLI
             tar -czvf "Managed-USB-Hub-Linux-${{ matrix.arch }}.tar.gz" "hub-cli"
          else
             # AMD64 打包 GUI 和 CLI
             tar -czvf "Managed-USB-Hub-Linux-${{ matrix.arch }}.tar.gz" "Managed USB Hub" "hub-cli"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Managed-USB-Hub-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/bin/*.zip
            build/bin/*.tar.gz
            
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/bin/*.zip
            build/bin/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
