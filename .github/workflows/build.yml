name: Wails Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: windows-latest
            platform: windows/amd64
          - os: macos-latest
            platform: darwin/universal

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Build GUI App
        if: matrix.os == 'windows-latest'
        run: |
          wails build -platform ${{ matrix.platform }} -tags webkit2_41 -nsis

      - name: Build GUI App (Non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          wails build -platform ${{ matrix.platform }} -tags webkit2_41

      - name: Build CLI Tool
        shell: bash
        run: |
          mkdir -p build/bin
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            go build -o "build/bin/hub-cli.exe" ./cmd/hub-cli
          else
            go build -o "build/bin/hub-cli" ./cmd/hub-cli
          fi

      - name: Package macOS App
        if: matrix.os == 'macos-latest'
        run: |
          cd build/bin
          zip -r "Managed-USB-Hub-macOS.zip" "Managed USB Hub.app" "hub-cli"

      - name: Package Windows App
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # 移动生成的安装包到 build/bin 目录以便统一打包上传
          # Wails 默认将安装包生成在 build/bin 目录下，名称通常为 "Managed USB Hub-amd64-installer.exe"
          # 我们将其重命名并包含在 Release 中
          $installer = Get-ChildItem "build/bin/*installer.exe" | Select-Object -First 1
          if ($installer) {
            Move-Item $installer.FullName "build/bin/Managed-USB-Hub-Setup.exe"
          } else {
             Write-Error "Installer not found! Contents of build/bin:"
             Get-ChildItem "build/bin" | Format-Table Name
          }
          
          # 同时保留便携版压缩包
          Compress-Archive -Path "build/bin/Managed USB Hub.exe", "build/bin/hub-cli.exe" -DestinationPath "build/bin/Managed-USB-Hub-Windows-Portable.zip"

      - name: Package Linux App
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd build/bin
          tar -czvf "Managed-USB-Hub-Linux.tar.gz" "Managed USB Hub" "hub-cli"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Managed-USB-Hub-${{ matrix.os }}
          path: |
            build/bin/*.zip
            build/bin/*.tar.gz
            build/bin/Managed-USB-Hub-Setup.exe
            
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/bin/*.zip
            build/bin/*.tar.gz
            build/bin/Managed-USB-Hub-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
