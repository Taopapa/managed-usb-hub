name: Wails Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          check-latest: true
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
        
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config
          
      - name: Build GUI App (Windows)
        if: matrix.os == 'windows-latest'
        run: wails build -platform windows/amd64

      - name: Build GUI App (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: wails build -platform linux/amd64

      - name: Build GUI App (macOS)
        if: matrix.os == 'macos-latest'
        run: wails build -platform darwin/universal
        
      - name: Build CLI Tool
        shell: bash
        run: |
          mkdir -p build/bin
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            go build -o build/bin/hub-cli.exe ./cmd/hub-cli
          else
            go build -o build/bin/hub-cli ./cmd/hub-cli
          fi
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ManagedUSBHub-${{ matrix.os }}
          path: build/bin/*
